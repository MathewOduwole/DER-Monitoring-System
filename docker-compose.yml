# I'm using Docker Compose to orchestrate all five services locally.
# Health checks with dependency conditions ensure services start in the right order:
# PostgreSQL and Kafka must be healthy before the API or telemetry consumer starts.
services:
  postgres:
    image: postgres:16-alpine
    container_name: der-postgres
    environment:
      POSTGRES_USER: der_user
      POSTGRES_PASSWORD: der_password
      POSTGRES_DB: der_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U der_user -d der_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: der-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: der-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: der-api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://der_user:der_password@postgres:5432/der_monitoring
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "5001:5000"

  telemetry:
    build:
      context: ./services/telemetry
      dockerfile: Dockerfile
    container_name: der-telemetry
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://der_user:der_password@postgres:5432/der_monitoring
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

volumes:
  postgres_data:
