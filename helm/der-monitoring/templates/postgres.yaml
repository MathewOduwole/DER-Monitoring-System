apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "der-monitoring.fullname" . }}-postgres-pvc
  labels:
    {{- include "der-monitoring.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "der-monitoring.fullname" . }}-postgres
  labels:
    {{- include "der-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "der-monitoring.fullname" . }}-postgres-pvc
        - name: init-sql
          configMap:
            name: {{ include "der-monitoring.fullname" . }}-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "der-monitoring.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
  selector:
    app.kubernetes.io/component: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "der-monitoring.fullname" . }}-init-sql
  labels:
    {{- include "der-monitoring.labels" . | nindent 4 }}
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS ders (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL UNIQUE,
        mrid_id VARCHAR(255) NOT NULL,
        location VARCHAR(255),
        type VARCHAR(100) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS telemetry_data (
        id SERIAL PRIMARY KEY,
        der_id INTEGER NOT NULL REFERENCES ders(id) ON DELETE CASCADE,
        active_power DOUBLE PRECISION NOT NULL,
        reactive_power DOUBLE PRECISION NOT NULL,
        voltage DOUBLE PRECISION NOT NULL,
        timestamp TIMESTAMP WITH TIME ZONE NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS charts (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        der_names JSONB NOT NULL DEFAULT '[]',
        start_date TIMESTAMP WITH TIME ZONE NOT NULL,
        end_date TIMESTAMP WITH TIME ZONE NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        CONSTRAINT max_three_ders CHECK (jsonb_array_length(der_names) <= 3),
        CONSTRAINT max_fourteen_days CHECK (end_date - start_date <= INTERVAL '14 days')
    );
    CREATE INDEX IF NOT EXISTS idx_telemetry_der_id ON telemetry_data(der_id);
    CREATE INDEX IF NOT EXISTS idx_telemetry_timestamp ON telemetry_data(timestamp);
    CREATE INDEX IF NOT EXISTS idx_telemetry_der_timestamp ON telemetry_data(der_id, timestamp DESC);
    CREATE INDEX IF NOT EXISTS idx_ders_name ON ders(name);
